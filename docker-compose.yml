# Face catalog stack: Postgres (pgvector) + GPU web app + on-demand jobs.
#
#   docker compose up -d db webapp          # run the database and web UI
#   docker compose run --rm index           # index all roots (crash-resumable)
#   docker compose run --rm group           # rebuild face groups (crash-resumable)
#
# GPU services need the NVIDIA Container Toolkit on the host so that
# `driver: nvidia` device reservations resolve. See README "Docker" section.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: facecat-db
    environment:
      POSTGRES_USER: facecat
      POSTGRES_PASSWORD: facecat
      POSTGRES_DB: facecat
    ports:
      - "5432:5432"
    volumes:
      # DB data lives on the host at ./pg (bind mount, owned by uid 999),
      # so `docker compose down -v` no longer wipes it.
      - ./pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facecat -d facecat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  webapp:
    build: .
    container_name: facecat-web
    env_file: .docker.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Photo tree to index/search (read-only). Adjust the host path as needed.
      - ./photos:/photos:ro
      # Thumbnails + insightface model cache persist across container restarts.
      - facecat_thumbs:/data/thumbs
      - facecat_models:/home/app/.insightface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # One-off indexing job (crash-resumable: re-run to continue).
  index:
    build: .
    env_file: .docker.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "facecat.index_cli", "index-all", "--threads-per-gpu", "4"]
    volumes:
      - ./photos:/photos:ro
      - facecat_thumbs:/data/thumbs
      - facecat_models:/home/app/.insightface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

  # One-off group rebuild job (crash-resumable: re-run to continue).
  group:
    build: .
    env_file: .docker.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "facecat.group_cli", "rebuild", "--threads-per-gpu", "4"]
    volumes:
      - ./photos:/photos:ro
      - facecat_thumbs:/data/thumbs
      - facecat_models:/home/app/.insightface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

volumes:
  facecat_thumbs:
  facecat_models: