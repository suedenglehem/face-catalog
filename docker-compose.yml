services:
  db:
    image: pgvector/pgvector:pg16
    container_name: facecat-db
    environment:
      POSTGRES_USER: facecat
      POSTGRES_PASSWORD: facecat
      POSTGRES_DB: facecat
    ports:
      - "5432:5432"
    volumes:
      - facecat_dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facecat -d facecat"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  facecat_dbdata:
